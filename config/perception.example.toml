# T-FIX-29 standalone perception settings (hamberger §6.3, ported).
# The frozen lab Config rejects unknown keys, so these live here — not in
# config/lab.example.toml — with their own loader
# (src/wow_bot/perception/perception_config.py).
# Shape-only validation: the loader never checks file existence, so MOCK_MODE
# and CI load this without Tesseract, YOLO weights, or template PNGs.

# Core perception metadata
[perception]
# Config schema version (must equal 1)
schema_version = 1
# Absolute path to the Tesseract OCR engine binary (set at reader
# construction time via pytesseract.pytesseract.tesseract_cmd, never import)
tesseract_cmd = "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
# Screen resolution the ROIs below were calibrated at (port plan risk R-10)
calibrated_resolution = [1920, 1080]

# Capture frame-rate budget (cheap channels run every frame)
[capture]
# Idle capture rate in frames per second
idle_fps = 10
# Combat capture rate in frames per second
combat_fps = 30

# Bar reader regions (x, y, width, height in calibrated pixels)
[bars]
# HP bar region of interest
hp_roi = [514, 771, 123, 18]
# Mana bar region of interest
mana_roi = [514, 793, 123, 17]
# Sampling budget in Hz; 'inf' means read on every frame (cheap channel)
sampling_hz = inf

# Combat edge detector tuning
[combat]
# Pixel width of the screen-edge strip examined for red
edge_size = 150
# Red-pixel ratio above which combat is declared
red_ratio_thresh = 0.02
# Cooldown latch in seconds before combat may clear
cooldown_s = 1.0
# Sampling budget in Hz; 'inf' means scan edges on every frame (cheap channel)
sampling_hz = inf

# Target reader: template matching + OCR + whitelist
[target]
# Template PNG for the target nameplate
name_template = "models/target_name_template.png"
# Template PNG for the target frame
frame_template = "models/target_template.png"
# Enemy name whitelist (generalises poorly; advisory until YOLO classes land)
known_enemies = ["Defias Thug", "Kobold Vermin"]
# First-pass template-match threshold from hamberger _find_target
match_thresh = 0.35
# Confirmation template-match threshold from hamberger _find_target
confirm_thresh = 0.80
# OCR acceptance threshold from hamberger _find_target
ocr_thresh = 0.50
# OCR confirmation threshold from hamberger _find_target
ocr_confirm_thresh = 0.85
# Sampling budget in Hz; OCR is throttled and cached between samples (§6.6)
sampling_hz = 2.0
# Accepted reads between re-OCR runs while the nameplate stays locked
name_refresh_frames = 5

# Enemy detector (YOLO stack is the optional 'yolo' extra)
[enemies]
# YOLO weights path resolved from config; gitignored (*.pt), fail-closed
yolo_weights = "models/weights/best.pt"
# YOLO detection confidence threshold
confidence = 0.5
# Sampling budget in Hz; YOLO inference is sampled, not run per frame (§6.6)
sampling_hz = 2.0

# Event detector OCR regions (x, y, width, height in calibrated pixels)
[events]
# Combat-log OCR region
combat_region = [10, 700, 420, 200]
# Chat OCR region
chat_region = [10, 900, 420, 150]
# Sampling budget in Hz; OSC is throttled and cached between samples (§6.6)
sampling_hz = 1.0

# Minimap tracker
[minimap]
# Minimap region of interest
minimap_roi = [1705, 33, 206, 217]
# Player-arrow template PNG
arrow_template = "models/arrow_template.png"
# Circular-mean smoothing window in frames
smoothing_frames = 5
# Sampling budget in Hz; template match is throttled and cached (§6.6)
sampling_hz = 5.0
# Minimum template-match score for accepting the arrow
match_thresh = 0.55

# T-FIX-30 world-pose channel: OCR of an on-screen addon coordinate frame.
# Decision A of HAMBERGER_PORT_PLAN §F-1, recorded in ADR-003. The minimap
# arrow is NOT this channel: it returns screen pixels, not world coordinates.
[pose]
# Region of interest of the addon coordinate text (x, y, width, height)
coordinate_roi = [1720, 40, 180, 24]
# Minimum mean OCR word confidence for a pose to be emitted
min_confidence = 0.6
# Sampling budget in Hz; OCR is throttled and cached between samples (§6.6)
sampling_hz = 1.0

# T-FIX-30 target-reaction channel: nameplate text colour classifies the
# reaction (red hostile / yellow neutral / green friendly).
[reaction]
# Region of interest holding the nameplate text (x, y, width, height)
nameplate_roi = [560, 300, 800, 40]
# Minimum coloured pixels before a reaction is attempted
min_pixels = 12
# Minimum share of the coloured pixels the winning reaction must hold
dominance_thresh = 0.6
# Sampling budget in Hz; 'inf' means classify on every frame (cheap channel)
sampling_hz = inf

# T-FIX-30 target-distance channel: nameplate HP-bar width -> yards.
# Inverse-proportional model: distance = reference_distance_yd *
# reference_width_px / observed_width_px. Calibration constants, not guesses.
[proximity]
# Nameplate HP-bar pixel width observed at reference_distance_yd
reference_width_px = 120.0
# Distance in yards at which the nameplate bar renders reference_width_px wide
reference_distance_yd = 10.0
# Minimum nameplate template-match score for a distance to be emitted
min_confidence = 0.5
# Sampling budget in Hz; 'inf' means convert on every frame (cheap channel)
sampling_hz = inf

# T-FIX-31 Bag frame channel: the bag window's slot grid read while the
# window is open. inventory_count is the occupied-slot count; inventory_max
# is the grid size. Opportunistic: absent window -> both fields None.
[bag]
# Top-left pixel of the first slot in the grid (x, y in calibrated pixels)
grid_origin = [1600, 700]
# Slot columns in the grid
columns = 4
# Slot rows in the grid
rows = 4
# Slot interior size in pixels [width, height]; must match the templates
slot_size = [36, 36]
# Pixels between two adjacent slots (both axes)
gap = 2
# Template PNG for an empty slot
empty_slot_template = "models/bag_empty_slot_template.png"
# Template PNG for an occupied slot
occupied_slot_template = "models/bag_occupied_slot_template.png"
# Minimum mean per-slot template-match score for a count to be emitted
min_confidence = 0.7
# Sampling budget in Hz; template matching is throttled and cached (§6.6)
sampling_hz = 1.0

# T-FIX-31 XP bar channel: bar fill fraction + OCR'd level label, emitted as
# the single monotone level_or_xp scalar.
[xp]
# Experience bar region of interest (x, y, width, height)
bar_roi = [600, 1060, 720, 12]
# Level label region of interest; omit the key entirely when not on screen
level_roi = [560, 1050, 36, 20]
# Minimum bar-fill / level-OCR confidence for the field to be emitted
min_confidence = 0.5
# Sampling budget in Hz; OCR is throttled and cached between samples (§6.6)
sampling_hz = 1.0

# T-FIX-31 Character frame channel: OCR of the character sheet's per-slot
# durability readouts, meaned over the slots read confidently.
[durability]
# Explicit regions of interest for the durability slots that are read
slot_rois = [[900, 300, 26, 26], [940, 300, 26, 26]]
# Minimum per-slot OCR score for that slot to join the mean
min_score = 0.5
# Share of configured slots that must read above min_score (the quorum)
quorum_fraction = 0.5
# Minimum confidence-weighted mean score for durability_fraction to be emitted
min_confidence = 0.6
# Sampling budget in Hz; OCR is throttled and cached between samples (§6.6)
sampling_hz = 1.0

# T-FIX-31 Enemy cast bar channel: the target-frame cast bar -> one
# IncomingCast entry, or an empty tuple when no cast is observed.
[cast]
# Cast bar region of interest holding the spell name (x, y, width, height)
cast_roi = [560, 260, 800, 26]
# Interruptibility border strip; omit the key entirely when not on screen
border_roi = [560, 258, 800, 3]
# True when the interruptibility border is rendered blue for interruptible
# casts; false when the client marks non-interruptible casts instead
border_interruptible = false
# Minimum OCR confidence for a cast to be emitted
min_confidence = 0.6
# Longest cast duration in seconds used with the bar fill fraction
max_remaining_s = 30.0
# Sampling budget in Hz; OCR is throttled and cached between samples (§6.6)
sampling_hz = 2.0

# T-FIX-31 Lootable-corpse indicator: colour segmentation for the loot
# sparkle. Gated off until §6 precision/recall is measurable, so the field
# stays None and the loot consumer keeps raising.
[loot]
# Region of interest holding the loot sparkle (x, y, width, height)
sparkle_roi = [760, 400, 320, 200]
# Minimum sparkle-coloured pixels before a positive is considered
min_pixels = 40
# Minimum share of bright pixels the sparkle class must hold
dominance_thresh = 0.6
# Minimum sparkle dominance for target_is_lootable to be emitted
min_confidence = 0.9
# Sampling budget in Hz; colour segmentation is throttled and cached (§6.6)
sampling_hz = 1.0

# T-FIX-31 spell-name -> spell-id table for the Enemy cast bar channel.
# A name absent from this table drops the cast rather than guessing an id.
[cast.spell_ids]
# One entry per spell the reactive layer may interrupt
"Shadow Bolt" = 686

# T-FIX-22 Minimum confidence required for perception observations (0.0 to 1.0).
# Observations with confidence below their threshold surface as None.
[confidence]
# Default minimum confidence for observations without a specific threshold
default_threshold = 0.5
# Minimum confidence for bag slot inventory counts
inventory_count = 0.7
# Minimum confidence for total bag capacity
inventory_max = 0.7
# Minimum confidence for level / xp readouts
level_or_xp = 0.5
# Minimum confidence for character sheet durability fraction
durability_fraction = 0.6
# Minimum confidence for lootable corpse sparkle indicator
target_is_lootable = 0.9
# Minimum confidence for player position coordinates
position = 0.6

