[project]
name = "wow-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "numpy>=2.0.0",
    "aiosqlite>=0.20.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "psutil>=6.0.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    # T-FIX-29: real-perception capture and image processing. Imported only
    # from wow_bot.perception behind perception/deps.py guards, so MOCK_MODE
    # never loads them and tests do not require them at runtime.
    "mss>=9.0.0",
    "opencv-python-headless>=4.9.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
# T-FIX-29: optional YOLO detector stack for the real enemy channel. Excluded
# from the base install because it pulls torch (~2 GB) and MOCK_MODE never
# uses it. Install with: uv sync --extra yolo
yolo = [
    "ultralytics>=8.2.0",
    "torch>=2.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
